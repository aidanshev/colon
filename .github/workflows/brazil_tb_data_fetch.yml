name: Brazil TB public-data fetch

on:
  push:
    branches:
      - automation/brazil-tb-model-20260718
    paths:
      - .github/workflows/brazil_tb_data_fetch.yml
  pull_request:
    branches:
      - feat/initial-simulation-structure
    paths:
      - .github/workflows/brazil_tb_data_fetch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-goias-tb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official Goias SINAN-TB CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          URL='https://dadosabertos.go.gov.br/dataset/ed7560d6-8547-420f-b86e-6a9b2389dcfb/resource/7da6db7e-7ac4-4a9d-9b8f-c8ff3b141f75/download/tuberculose.csv'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "$URL" -o artifact/goias_tuberculose.csv
          test "$(stat -c%s artifact/goias_tuberculose.csv)" -gt 100000
          sha256sum artifact/goias_tuberculose.csv > artifact/SHA256SUMS.txt
          printf '%s\n' "$URL" > artifact/SOURCE_URL.txt

      - name: Validate and profile CSV without external dependencies
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path

          p = Path('artifact/goias_tuberculose.csv')
          with p.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              columns = reader.fieldnames or []
              required = {'nu_notificacao','dt_diag_sintoma','dmun_codibge','dmun_municipiox','dmun_regiao_saudex','dmun_macro_regiaox','tp_entrada','tp_molecular','tp_sensibilidade'}
              missing = sorted(required - set(columns))
              if missing:
                  raise SystemExit(f'Missing required fields: {missing}; columns={columns}')
              rows = 0
              seen = set()
              duplicate_ids = 0
              municipalities = set()
              dates = []
              molecular = Counter()
              sensitivity = Counter()
              entry = Counter()
              for row in reader:
                  rows += 1
                  notification_id = row.get('nu_notificacao', '')
                  if notification_id:
                      if notification_id in seen:
                          duplicate_ids += 1
                      seen.add(notification_id)
                  municipality = row.get('dmun_codibge', '')
                  if municipality:
                      municipalities.add(municipality)
                  date_value = row.get('dt_diag_sintoma', '')
                  if date_value:
                      dates.append(date_value)
                  molecular[row.get('tp_molecular', '') or '<NA>'] += 1
                  sensitivity[row.get('tp_sensibilidade', '') or '<NA>'] += 1
                  entry[row.get('tp_entrada', '') or '<NA>'] += 1

          profile = {
              'rows': rows,
              'columns': columns,
              'duplicate_notification_ids': duplicate_ids,
              'date_min_raw': min(dates) if dates else None,
              'date_max_raw': max(dates) if dates else None,
              'municipalities': len(municipalities),
              'molecular_values': dict(molecular.most_common(50)),
              'sensitivity_values': dict(sensitivity.most_common(50)),
              'entry_values': dict(entry.most_common(50)),
          }
          Path('artifact/RAW_PROFILE.json').write_text(json.dumps(profile, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(profile, ensure_ascii=False, indent=2))
          PY

      - name: Upload immutable source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brazil-goias-tb-source-20260718
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
